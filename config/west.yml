manifest:
  version: "0.13"
  defaults:
    remote: zmkfirmware
    revision: v0.3

  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware

  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml

  self:
    path: config
    import:
      - name: zmk-config
